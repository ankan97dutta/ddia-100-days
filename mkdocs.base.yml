site_name: 100 Days of DDIA
site_description: A hands-on study track for Designing Data-Intensive Applications
site_url: https://ankan97dutta.github.io/ddia-100-days/
repo_url: https://github.com/ankan97dutta/ddia-100-days
repo_name: ankan97dutta/ddia-100-days
edit_uri: edit/main/

docs_dir: docs
site_dir: site

# Exercise/starter pages are linked from each day but kept out of the sidebar.
not_in_nav: |
  /days/*/exercise.md
  /days/*/starter.md

validation:
  omitted_files: ignore
  absolute_links: ignore
  unrecognized_links: warn

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ankan97dutta/ddia-100-days
      name: GitHub

# Nav is generated by scripts/build_docs_site.py into scripts/nav.generated.yml
# and merged at build time by scripts/render_mkdocs_config.py
